name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      # Build-time value only; the real domain is set in the deployment environment.
      NEXT_PUBLIC_SITE_URL: https://ci.example.invalid
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Validate database schema
        run: npm run db:validate

      - name: Build
        run: npm run build

      - name: Smoke test the production server
        run: |
          ENQUIRY_DATA_DIR="$RUNNER_TEMP/enquiries" npm start -- -p 3000 &
          for i in $(seq 1 30); do curl -sf http://localhost:3000/ >/dev/null && break; sleep 1; done
          npm run smoke -- http://localhost:3000
