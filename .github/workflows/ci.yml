name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # A throwaway PostgreSQL used only to prove the migration works. It is NOT Supabase and holds no real data.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      # Build-time value only; the real domain is set in the deployment environment.
      NEXT_PUBLIC_SITE_URL: https://ci.example.invalid
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Validate database schema
        run: npm run db:validate

      - name: Migration applies to PostgreSQL and its rules hold
        env:
          PGPASSWORD: ci-only-password
        run: |
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -q -c "CREATE ROLE anon NOLOGIN" -c "CREATE ROLE authenticated NOLOGIN"
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -q <<'SQL'
          GRANT USAGE ON SCHEMA public TO anon, authenticated;
          ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON TABLES TO anon, authenticated;
          SQL
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -q -f prisma/migrations/0001_init/migration.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -q -t -f prisma/tests/migration-checks.sql

      - name: Build
        run: npm run build

      - name: No server-only secrets in the browser bundle
        run: |
          # The names come from lib/env.ts, so a variable added later is covered automatically.
          test -d .next/static || { echo ".next/static is missing - nothing to check, so failing" >&2; exit 1; }
          names=$(grep -oE '^  [A-Z][A-Z0-9_]+:' lib/env.ts | tr -d ' :' | paste -sd'|' -)
          count=$(printf '%s' "$names" | tr '|' '\n' | wc -l)
          test "$count" -ge 5 || { echo "could not read the variable names from lib/env.ts" >&2; exit 1; }
          echo "Looking for: $names"
          # Client JavaScript, plus the prerendered pages (HTML / RSC payloads) that are sent to every visitor.
          # -l lists file names only (minified chunks are huge single lines).
          leaks=$( { grep -rlE "$names" .next/static; grep -rlE --include='*.html' --include='*.rsc' "$names" .next/server/app; } 2>/dev/null || true )
          if [ -n "$leaks" ]; then
            echo "$leaks"
            echo "A server-only variable name reached what visitors download (files listed above)" >&2; exit 1
          fi

      - name: Smoke test the production server
        run: |
          ENQUIRY_DATA_DIR="$RUNNER_TEMP/enquiries" npm start -- -p 3000 &
          for i in $(seq 1 30); do curl -sf http://localhost:3000/ >/dev/null && break; sleep 1; done
          npm run smoke -- http://localhost:3000
